html{font-size:112.5%;-webkit-text-size-adjust:100%}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg0);color:var(--cream);font:400 1rem/1.5 var(--sans);overflow-x:hidden}
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background:radial-gradient(50rem 28rem at 85% -10%,rgba(16,128,118,.34),transparent 62%)}
h1,h2,h3{font-family:var(--display);font-weight:400;margin:0;line-height:1.1;letter-spacing:.02em}
p{margin:0}
button,input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--cream);outline-offset:3px}
.logo{display:block;background:currentColor;-webkit-mask:var(--m-horiz) center/contain no-repeat;mask:var(--m-horiz) center/contain no-repeat;aspect-ratio:639/175}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.5rem;min-height:3.1rem;padding:.6rem 1.3rem;border-radius:99px;border:2px solid var(--cream);background:var(--cream);color:var(--bg2);font-weight:700;cursor:pointer;-webkit-tap-highlight-color:transparent}
.btn.sec{background:transparent;color:var(--cream);border-color:var(--line2)}
.btn.ghost{background:var(--glass);color:var(--cream);border-color:var(--line)}
.btn.warn{background:transparent;color:var(--err);border-color:var(--err)}
.btn.block{width:100%}
.btn[disabled]{opacity:.4;cursor:not-allowed}
label.f{display:block;font-weight:700;margin-bottom:.35rem}
.in{width:100%;min-height:3.1rem;padding:.6rem .9rem;border:1.5px solid var(--line2);border-radius:.8rem;background:rgba(0,0,0,.22)}
.in::placeholder{color:#8FA59F}
.in:focus{border-color:var(--cream);outline:none;box-shadow:0 0 0 3px rgba(255,242,227,.18)}
textarea.in{min-height:5.5rem;resize:vertical}
.field{margin-bottom:1rem}
.hint{color:var(--muted);font-size:.92rem;margin-top:.3rem}
.err{color:var(--err);font-weight:700;min-height:1.3em;margin-top:.3rem}
.glass{background:linear-gradient(180deg,rgba(255,242,227,.08),rgba(255,242,227,.03));border:1px solid var(--line);border-radius:1.2rem}

#tela-pin{min-height:100vh;min-height:100dvh;display:grid;place-items:center;padding:1.2rem}
.pin-card{width:100%;max-width:24rem;padding:1.6rem 1.3rem}
.pin-card .logo{width:12rem;margin:0 auto 1.4rem;color:var(--cream)}
.pin-card h1{font-size:1.8rem;text-align:center;margin-bottom:.3rem}
.pin-card p.s{color:var(--muted);text-align:center;margin-bottom:1.2rem}
.pin-card .in{text-align:center;font-size:1.5rem;letter-spacing:.35em}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:rgba(0,31,29,.8);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.top-in{max-width:60rem;margin:0 auto;padding:.6rem 1rem;display:flex;align-items:center;gap:.7rem}
.top .logo{height:2.3rem;color:var(--cream);margin-right:auto}
.role{font:700 .75rem var(--sans);letter-spacing:.16em;text-transform:uppercase;border:1px solid var(--line2);border-radius:99px;padding:.25rem .7rem;color:var(--muted)}
.top .btn{min-height:2.6rem;padding:.2rem .9rem}
@media(max-width:34rem){.top-in{gap:.45rem;padding:.5rem .7rem}.top .logo{height:1.8rem;min-width:0;flex-shrink:1}.role{font-size:.66rem;letter-spacing:.08em;padding:.2rem .5rem}.top .btn{padding:.2rem .7rem;font-size:.95rem}}
.wrap{max-width:60rem;margin:0 auto;padding:1rem 1rem 6rem}
.demo{background:rgba(198,36,59,.18);border-bottom:1px solid rgba(198,36,59,.5);text-align:center;padding:.5rem 1rem;font-size:.9rem}
.tabs{display:grid;grid-template-columns:1fr 1fr 1.35fr;gap:.3rem;padding:.3rem;margin-bottom:1rem;border:1px solid var(--line);border-radius:99px;background:var(--glass)}
.tab{min-height:3rem;padding:0 .3rem;border-radius:99px;border:0;background:transparent;font-weight:700;font-size:.95rem;cursor:pointer}
.tab[aria-pressed="true"]{background:var(--cream);color:var(--bg2)}
.stats{display:flex;flex-wrap:wrap;gap:.5rem;margin-bottom:.8rem}
.chip{min-height:2.7rem;padding:.3rem 1rem;border-radius:99px;border:1.5px solid var(--line2);background:transparent;cursor:pointer;font-weight:700}
.chip[aria-pressed="true"]{background:var(--cream);color:var(--bg2);border-color:var(--cream)}
.chip .n{opacity:.75;font-weight:400;margin-left:.3rem}
.tools{display:grid;grid-template-columns:1fr;gap:.6rem;margin-bottom:1rem}
@media(min-width:40rem){.tools{grid-template-columns:2fr 1fr}}
.list{display:grid;gap:.6rem}
.row{display:grid;grid-template-columns:1fr;gap:.6rem;padding:.8rem;border:1px solid var(--line);border-radius:1rem;background:var(--glass)}
@media(min-width:44rem){.row{grid-template-columns:1fr auto auto;align-items:center}}
.row .info b{display:block;font-size:1.08rem}
.row .info small{color:var(--muted)}
.row.st-falta{border-color:rgba(198,36,59,.7)}
.row.st-oculto{opacity:.6;border-style:dashed}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:.25rem;padding:.25rem;border:1px solid var(--line2);border-radius:99px}
.seg.two{grid-template-columns:repeat(2,1fr)}
.seg button{min-height:2.9rem;padding:0 .8rem;border-radius:99px;border:0;background:transparent;font-weight:700;cursor:pointer;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--cream);color:var(--bg2)}
.seg button[data-s="falta"][aria-pressed="true"]{background:var(--red);color:#fff}
.seg button[data-s="oculto"][aria-pressed="true"]{background:var(--muted);color:var(--bg0)}
.edit{min-height:2.9rem;padding:0 1rem;border-radius:99px;border:1.5px solid var(--line2);background:transparent;cursor:pointer;font-weight:700}
.foot{display:flex;flex-wrap:wrap;gap:.6rem;margin-top:1.4rem}
.foot .btn{flex:1 1 12rem}
.empty{color:var(--muted);padding:1.5rem 0}
dialog{border:1px solid var(--line2);border-radius:1.3rem;padding:0;width:min(100% - 1rem,38rem);max-height:calc(100% - 1rem);max-height:calc(100dvh - 1rem);background:var(--bg1);color:var(--cream);box-shadow:0 30px 80px #000a}
dialog::backdrop{background:rgba(0,10,9,.72)}
.dlg{padding:1.2rem 1.1rem 1.5rem}
.dlg-h{display:flex;justify-content:space-between;align-items:center;gap:1rem;margin-bottom:1rem}
.dlg-h h3{font-size:1.8rem}
.x{min-width:3rem;min-height:3rem;border-radius:99px;border:1.5px solid var(--line2);background:transparent;cursor:pointer;font-size:1.3rem;line-height:1}
fieldset{border:0;padding:0;margin:0 0 1rem;min-width:0}
legend{font-weight:700;margin-bottom:.4rem;padding:0}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,8rem),1fr));gap:.5rem}
.opt{position:relative}
.opt input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
.opt span{display:flex;align-items:center;justify-content:center;min-height:3rem;padding:.3rem .6rem;border:1.5px solid var(--line2);border-radius:.9rem;background:var(--glass);font-weight:700;text-align:center}
.opt input:checked+span{background:var(--cream);border-color:var(--cream);color:var(--bg2)}
.opt input:focus-visible+span{outline:3px solid var(--cream);outline-offset:3px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:.7rem}
@media(max-width:26rem){.row2{grid-template-columns:1fr}}
.foto{display:flex;gap:.8rem;align-items:center;flex-wrap:wrap}
.foto .prev{width:6.5rem;aspect-ratio:4/3;border-radius:.7rem;border:1px dashed var(--line2);background:var(--bg0);overflow:hidden;display:grid;place-items:center;color:var(--muted);font-size:.8rem;text-align:center}
.foto .prev img{width:100%;height:100%;object-fit:cover}
.foto input[type=file]{display:none}
.actions{display:grid;gap:.6rem;margin-top:.6rem}
.delbox{margin-top:1.4rem;padding-top:1rem;border-top:1px solid var(--line)}
.btn.del{width:100%;color:var(--err);border-color:transparent;background:transparent;font-size:.9rem}
.delmsg{font-size:.95rem;line-height:1.5;margin:0 0 .4rem}
#toast{position:fixed;left:50%;bottom:1.5rem;transform:translateX(-50%);background:var(--cream);color:var(--bg2);padding:.8rem 1.2rem;border-radius:1.2rem;font-weight:700;z-index:60;max-width:calc(100% - 2rem);text-align:center;box-shadow:0 8px 30px #0008}
#toast.bad{background:var(--red);color:#fff}
</style>

<section id="tela-pin">
  <form class="pin-card glass" id="form-pin">
    <div class="logo" role="img" aria-label="Gran Gusto Empório"></div>

    <div class="err" id="pin-err"></div>

</section>

/* ---------- API (planilha Google via Apps Script) ---------- */
let demoData = JSON.parse(JSON.stringify(SAMPLE));
const sleep = ms => new Promise(r=>setTimeout(r,ms));
async function demoApi(b){
  await sleep(120);
  const role = b.key==='demo' ? 'dono' : b.key==='balcao' ? 'balcao' : null;
  if(!role) return {ok:false,error:'pin'};
  const dono = role==='dono';
  const lista = t => t==='portfolio' ? demoData.portfolio : t==='tabua' ? demoData.tabua : demoData.produtos;
  if(b.action==='admin') return {ok:true, role, produtos:demoData.produtos, portfolio:demoData.portfolio, tabua:demoData.tabua};
  if(b.action==='setStatus'){ if(b.tipo==='tabua' && b.status==='falta') return {ok:false,error:'status'}; const x=lista(b.tipo).find(i=>i.id===b.id); if(x) x.status=b.status; return {ok:true}; }
  if(!dono) return {ok:false,error:'permissao'};
  if(b.action==='saveProduto'||b.action==='savePortfolio'||b.action==='saveTabua'){
    const l = b.action==='saveProduto' ? demoData.produtos : b.action==='saveTabua' ? demoData.tabua : demoData.portfolio, it=b.item;
    if(!it.id){ it.id='n'+Date.now().toString(36); l.push(it); } else { const i=l.findIndex(x=>x.id===it.id); l[i]=it; }
    return {ok:true, id:it.id};
  }
  if(b.action==='deleteItem'){ const l=lista(b.tipo==='produto'?'produto':b.tipo), i=l.findIndex(x=>x.id===b.id); if(i<0) return {ok:false,error:'nao encontrado'}; l.splice(i,1); return {ok:true}; }
  if(b.action==='uploadFoto') return {ok:true, id:'demo-'+Date.now()};
  if(b.action==='resetFalta'){ let n=0; demoData.produtos.concat(demoData.portfolio).forEach(x=>{ if(x.status==='falta'){ x.status='disponivel'; n++; } }); return {ok:true,n}; }
  return {ok:false,error:'acao'};
}
async function api(body){
  if(DEMO) return demoApi(Object.assign({key:pin}, body));
  const r = await fetch(CFG.apiUrl,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(Object.assign({key:pin},body))});
  return await r.json();
}

async function entrar(silencioso){
  try{
    const r = await api({action:'admin'});
    if(!r.ok){ if(!silencioso) $('#pin-err').textContent = r.error==='pin' ? 'PIN incorreto.' : 'Não foi possível entrar.'; store.del('ggadm_pin'); $('#tela-pin').hidden=false; $('#tela-app').hidden=true; return false; }
    role=r.role; D={produtos:r.produtos, portfolio:r.portfolio, tabua:r.tabua||[]};
    store.set('ggadm_pin',pin);
    $('#tela-pin').hidden=true; $('#tela-app').hidden=false; $('#demo').hidden=!DEMO;
    $('#role').textContent = role==='dono' ? 'Dono' : 'Balcão';
    render(); return true;
  }catch(e){
    if(!silencioso) $('#pin-err').textContent='Sem conexão com a planilha. Confira a internet e o endereço no config.js.';

}

    <fieldset id="w-cobr"><legend>Como é cobrado</legend><div class="opts"><label class="opt"><input type="radio" name="cobr" value="kg" ${it.cobranca!=='un'?'checked':''}><span>Por kg</span></label><label class="opt"><input type="radio" name="cobr" value="un" ${it.cobranca==='un'?'checked':''}><span>Peça fechada</span></label></div></fieldset>
    <div class="row2 field"><div><label class="f" for="f-preco" id="l-preco">Preço (R$)</label><input class="in" id="f-preco" inputmode="decimal" value="${it.preco?String(it.preco).replace('.',','):''}" placeholder="0,00"></div>
      <div id="w-peso"><label class="f" for="f-peso">Peso da peça (g)</label><input class="in" id="f-peso" inputmode="numeric" value="${it.pesoG?esc(it.pesoG):''}" placeholder="Ex.: 125"></div></div>
    <p class="hint" style="margin:-.4rem 0 1rem">Na tela, o cliente só vê o valor final estimado da tábua, nunca o preço por kg nem as gramas.</p>
    ${statusTab}<div class="err" id="f-err"></div>
    <div class="actions"><button class="btn" data-save>Salvar</button><button class="btn ghost" data-close>Cancelar</button></div>` : prod ? `
    <div class="dlg-h"><h3 id="dlg-t">${x?'Editar produto':'Novo produto'}</h3><button class="x" data-close aria-label="Fechar">×</button></div>
    <div class="field"><label class="f" for="f-nome">Nome</label><input class="in" id="f-nome" value="${esc(it.nome)}"></div>
    <div class="row2 field"><div><label class="f" for="f-cat">Categoria</label><input class="in" id="f-cat" list="cats" value="${esc(it.cat)}" placeholder="Ex.: Queijos"><datalist id="cats">${cats.map(c=>`<option value="${esc(c)}">`).join('')}</datalist></div>
      <div><fieldset style="margin:0"><legend>Vende por</legend><div class="opts"><label class="opt"><input type="radio" name="unid" value="kg" ${it.unid==='kg'?'checked':''}><span>Peso (kg)</span></label><label class="opt"><input type="radio" name="unid" value="un" ${it.unid==='un'?'checked':''}><span>Unidade</span></label></div></fieldset></div></div>
    <div class="row2 field"><div><label class="f" for="f-preco">Preço ${it.unid==='kg'?'por kg':'da unidade'} (R$)</label><input class="in" id="f-preco" inputmode="decimal" value="${it.preco?String(it.preco).replace('.',','):''}" placeholder="0,00"></div>
      <div><label class="f" for="f-promo">Preço de oferta (opcional)</label><input class="in" id="f-promo" inputmode="decimal" value="${it.promo?String(it.promo).replace('.',','):''}" placeholder="deixe vazio se não tem"></div></div>
    <div class="field"><label class="f" for="f-desc">Descrição</label><textarea class="in" id="f-desc" placeholder="Uma ou duas frases">${esc(it.desc)}</textarea></div>
    <fieldset id="f-preps"><legend>Como o cliente pode pedir (só para produtos por peso)</legend><div class="opts">${PREPS.map(([k,t])=>`<label class="opt"><input type="checkbox" name="prep" value="${t}" ${(it.prep||[]).includes(t)?'checked':''}><span>${t}</span></label>`).join('')}</div></fieldset>
    ${fotoBlk}${status}<div class="err" id="f-err"></div>
    <div class="actions"><button class="btn" data-save>Salvar</button><button class="btn ghost" data-close>Cancelar</button></div>` : `
    <div class="dlg-h"><h3 id="dlg-t">${x?'Editar tábua':'Nova tábua'}</h3><button class="x" data-close aria-label="Fechar">×</button></div>
    <div class="field"><label class="f" for="f-nome">Nome</label><input class="in" id="f-nome" value="${esc(it.nome)}" placeholder="Ex.: Clássica"></div>
    <div class="field"><label class="f" for="f-desc">Descrição</label><textarea class="in" id="f-desc">${esc(it.desc)}</textarea></div>
    <div class="row2 field"><div><label class="f" for="f-pess">Para quantas pessoas</label><input class="in" id="f-pess" inputmode="numeric" value="${esc(it.pessoas)}"></div>
      <div><fieldset style="margin:0"><legend>Serve como</legend><div class="opts"><label class="opt"><input type="radio" name="oc" value="entrada" ${it.ocasiao!=='principal'?'checked':''}><span>Entrada</span></label><label class="opt"><input type="radio" name="oc" value="principal" ${it.ocasiao==='principal'?'checked':''}><span>Prato principal</span></label></div></fieldset></div></div>
    <div class="field"><label class="f" for="f-itens">O que vai na tábua (um item por linha)</label><textarea class="in" id="f-itens">${esc((it.itens||[]).join('\n'))}</textarea></div>
    <div class="field"><label class="f" for="f-preco">Preço (R$)</label><input class="in" id="f-preco" inputmode="decimal" value="${it.preco?String(it.preco).replace('.',','):''}" placeholder="0,00"></div>
    ${fotoBlk}${status}<div class="err" id="f-err"></div>
    <div class="actions"><button class="btn" data-save>Salvar</button><button class="btn ghost" data-close>Cancelar</button></div>`;
  if(x) $('#dlg-c').insertAdjacentHTML('beforeend',`<div class="delbox" id="delbox"><button class="btn ghost del" type="button" data-del1>Excluir este ${tab?'item':prod?'produto':'portfólio'}...</button></div>`);
  attUnid(); attTab();
  $('#dlg').showModal();
}
function attUnid(){ const p=$('#f-preps'); if(!p) return; const kg=($('input[name=unid]:checked')||{}).value==='kg'; p.hidden=!kg; const l=document.querySelector('label[for=f-preco]'); if(l) l.textContent='Preço '+(kg?'por kg':'da unidade')+' (R$)'; }
function attTab(){
  if(!ed || !ed.tab) return;
  const tipo=($('input[name=tipo]:checked')||{}).value||'queijo', carne=tipo==='queijo'||tipo==='embutido';
  const cobr=carne ? ($('input[name=cobr]:checked')||{}).value : 'un';
  $('#w-grupo').hidden=!carne; $('#w-cobr').hidden=!carne; $('#w-peso').hidden=!(carne&&cobr==='un');
  $('#l-preco').textContent = 'Preço '+(carne ? (cobr==='kg'?'por kg':'da peça') : tipo==='fruta'?'por tábua (uma porção)':'por porção')+' (R$)';
}
function compress(file,max,q){
  return new Promise((res,rej)=>{
    const img=new Image(), u=URL.createObjectURL(file);
    img.onload=()=>{ const s=Math.min(1,max/Math.max(img.width,img.height)); const c=document.createElement('canvas'); c.width=Math.round(img.width*s); c.height=Math.round(img.height*s);
      c.getContext('2d').drawImage(img,0,0,c.width,c.height); URL.revokeObjectURL(u);
      c.toBlob(b=>{ const fr=new FileReader(); fr.onload=()=>res({b64:fr.result.split(',')[1], url:fr.result}); fr.readAsDataURL(b); },'image/jpeg',q); };
    img.onerror=()=>rej(new Error('img')); img.src=u;
  });
}
$('#dlg').addEventListener('change',async e=>{
  if(e.target.name==='unid'){ attUnid(); return; }
  if(e.target.name==='tipo'||e.target.name==='cobr'){ attTab(); return; }
  if(e.target.id==='f-file' && e.target.files[0]){
    const msg=$('#f-msg'); msg.textContent='Enviando foto...';
    try{
      const c=await compress(e.target.files[0],900,.8);
      const nome=(($('#f-nome')||{}).value||'foto').toLowerCase().replace(/[^a-z0-9]+/g,'-').slice(0,40)||'foto';
      const r=await api({action:'uploadFoto', nome, mime:'image/jpeg', data:c.b64});
      if(!r.ok) throw new Error(r.error);
      ed.item.foto=r.id; $('#f-prev').innerHTML=`<img src="${c.url}" alt="">`; msg.textContent='Foto enviada. Toque em Salvar para publicar.';
    }catch(err){ msg.textContent='Não foi possível enviar a foto. Tente de novo.'; }
  }
});
$('#dlg').addEventListener('click',async e=>{
  if(e.target.closest('[data-close]')){ $('#dlg').close(); return; }
  if(e.target.closest('[data-del1]')){
    $('#delbox').innerHTML=`<p class="delmsg"><b>Excluir de vez?</b> Isso apaga da planilha e não dá para desfazer. Se só quer tirar do ar por enquanto, use a Situação <b>Oculto</b>.</p><div class="actions"><button class="btn warn" type="button" data-del2>Sim, excluir de vez</button><button class="btn ghost" type="button" data-del0>Não, voltar</button></div>`; return; }
  if(e.target.closest('[data-del0]')){ $('#delbox').innerHTML=`<button class="btn ghost del" type="button" data-del1>Excluir...</button>`; return; }
  if(e.target.closest('[data-del2]')){
    const b=e.target.closest('[data-del2]'); b.disabled=true; b.textContent='Excluindo...';
    try{
      const r=await api({action:'deleteItem', tipo:ed.tab?'tabua':ed.prod?'produto':'portfolio', id:ed.item.id});
      if(!r.ok) throw new Error(r.error);
      const nome=ed.item.nome; $('#dlg').close(); await entrar(true); toast(nome+' foi excluído.');
    }catch(err){ b.disabled=false; b.textContent='Sim, excluir de vez'; toast('Não excluiu. Confira a internet e tente de novo.',true); }
    return;
  }
  if(e.target.closest('[data-rmfoto]')){ ed.item.foto=''; $('#f-prev').textContent='sem foto'; return; }
  if(!e.target.closest('[data-save]')) return;
  const it=ed.item, er=$('#f-err'); er.textContent='';
  it.nome=$('#f-nome').value.trim(); if($('#f-desc')) it.desc=$('#f-desc').value.trim(); it.status=$('#f-status').value;
  const preco=numBR($('#f-preco').value);
  if(!it.nome){ er.textContent='Escreva o nome.'; return; }
  if(!(preco>0)){ er.textContent='Digite o preço.'; return; }
  it.preco=preco;
  if(ed.tab){
    it.tipo=$('input[name=tipo]:checked').value; const carne=it.tipo==='queijo'||it.tipo==='embutido';
    it.cobranca = carne ? $('input[name=cobr]:checked').value : 'un';
    it.grupo = carne ? $('#f-grupo').value.trim() : '';
    it.pesoG = carne && it.cobranca==='un' ? (parseInt($('#f-peso').value,10)||0) : 0;
    if(carne && it.cobranca==='un' && !(it.pesoG>0)){ er.textContent='Digite o peso da peça em gramas.'; return; }
  } else if(ed.prod){
    it.cat=$('#f-cat').value.trim(); if(!it.cat){ er.textContent='Escolha a categoria.'; return; }
    it.unid=$('input[name=unid]:checked').value;
    const pr=numBR($('#f-promo').value); it.promo = pr>0 ? pr : null;
    it.prep = it.unid==='kg' ? [...document.querySelectorAll('input[name=prep]:checked')].map(i=>i.value) : [];
    if(it.unid==='kg' && !it.prep.length) it.prep=['Em pedaço'];
  } else {
    it.pessoas=parseInt($('#f-pess').value,10)||0; if(it.pessoas<1){ er.textContent='Digite para quantas pessoas.'; return; }
    it.ocasiao=$('input[name=oc]:checked').value;
    it.itens=$('#f-itens').value.split('\n').map(s=>s.trim()).filter(Boolean);
  }
  const btn=e.target.closest('[data-save]'); btn.disabled=true; btn.textContent='Salvando...';
  try{
    const r=await api({action:ed.tab?'saveTabua':ed.prod?'saveProduto':'savePortfolio', item:it});
    if(!r.ok) throw new Error(r.error);
    $('#dlg').close(); await entrar(true); toast('Salvo.');
  }catch(err){ er.textContent='Não salvou. Confira a internet e tente de novo.'; btn.disabled=false; btn.textContent='Salvar'; }
});

// abre direto se já tem PIN salvo
if(pin){ entrar(true).then(ok=>{ if(!ok){ $('#tela-pin').hidden=false; } }); }
</script>

</body></html>
